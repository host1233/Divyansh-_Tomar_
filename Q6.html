<body>
    <script>
        function fact(x){
            let factorial=1;5
            for(let i=1;i<=x;i++){
                factorial=factorial*i;
            }
            return factorial ;
            
        }
        let a=(Number(prompt("plz enter tha value ")));
         let x=fact(a);
         console.log(" Factorial " + x);
            alert(" Factorial " + x);
    </script>
</body>
